plugins {
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}


group = 'com.seunome'
version = '1.0.0'
archivesBaseName = 'double-damage'

java {
    // Alvo Java 17 (padrão do MDK 1.21.8)
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Variáveis de versão
ext {
    minecraft_version = '1.21.8'
    forge_version     = '58.0.1'
    mapping_channel   = 'official'
    mapping_version   = '1.21.8'
}

minecraft {
    // Mappings oficiais da Mojang para 1.21.8
    mappings channel: mapping_channel, version: mapping_version

    // A versão do Forge que você baixou
    version = "${minecraft_version}-${forge_version}"

    runDir = "run"

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                doubledamage {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('runServer')
            mods {
                doubledamage {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    // Traz a API do Forge (deobfuscada) só para compilação
    compileOnly fg.deobf("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // Habilita o validator para reconhecer @SubscribeEvent em tempo de compilação
    annotationProcessor fg.deobf("net.minecraftforge:eventbus-validator:7.0-beta.10")
}
